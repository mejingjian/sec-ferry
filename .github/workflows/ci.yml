name: CI

# 开源后每个 PR 都要有自动把关 —— 回归脚本本身很齐备（10 个脚本、200+ 用例，
# 且都支持 --base / --mock-ldap），接入成本很低，不做就太可惜了。
#
# 两个作业：
#   verify  不依赖平台的静态检查与回归：编码约定 / 镜像白名单 / 密钥轮换 / 哈希自检 / 引导部署
#   e2e     起 standalone + mock LDAP 后，由 scripts/ci-regressions.sh 一次跑完平台侧五套
#           （收发闭环 / 内容防护 / 冒烟 / 邮件 / 域账号登录）
# 结论尽量走 ::notice / ::error 注解 —— 步骤日志与 Job Summary 都需要登录才能看。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 静态检查与构建
    # 钉版本而非 ubuntu-latest：latest 将于 2026-10-19 迁到 Ubuntu 26，
    # 镜像换代（glibc/node 预装版本等）会让「昨天还绿」的构建突然变红。
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # 锁定在**最低支持版本**上跑（见 db/runtime.mjs）：CI 的一个价值就是守住下限。
          # 别往下调 —— 代码用到 Node 22.16 才有的 sqlite.backup() / setReturnArrays()。
          node-version: "22.16"
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: 类型检查
        run: npm run typecheck

      # 项目强依赖「.ps1 必须 UTF-8 BOM + CRLF」，这条约定只能靠检查兜住
      - name: PowerShell 编码约定
        run: npm run check:encoding

      # 运行期镜像是逐文件白名单拷贝，漏一个模块的后果是「构建成功但容器起不来」
      - name: 运行期镜像白名单
        run: npm run check:image

      # 密钥轮换是不可逆操作（原地覆盖密文），必须自动把关。
      # 它自带临时空库、不碰任何真实数据、也不需要平台在跑。
      - name: 密钥轮换回归
        run: npm run test:rekey

      - name: 哈希实现自检
        run: npm run check:sha256

      # bootstrap 是无人值守部署的唯一入口（容器首启 / IaC），写错的症状不是报错
      # 而是「部署完了登录不了」。同样自带临时空库与同进程 mock LDAP，不需要平台。
      - name: 引导部署回归
        run: npm run test:bootstrap

      - name: 构建（含 standalone 组装）
        run: npm run build

  e2e:
    name: 端到端回归
    # 钉版本而非 ubuntu-latest：latest 将于 2026-10-19 迁到 Ubuntu 26，
    # 镜像换代（glibc/node 预装版本等）会让「昨天还绿」的构建突然变红。
    runs-on: ubuntu-24.04
    needs: verify
    env:
      # 仅供 CI 使用的临时密钥（不承载任何真实数据，也不是秘密）
      CONFIG_ENCRYPTION_KEY: 4f3c2b1a4f3c2b1a4f3c2b1a4f3c2b1a4f3c2b1a4f3c2b1a4f3c2b1a4f3c2b1a
      DATA_DIR: ${{ github.workspace }}/.ci-data
      PORT: "8787"
      HOSTNAME: "127.0.0.1"
      # 注意：刻意不设 PLATFORM_ADMIN_EMAILS —— 回归脚本依赖「本地兜底管理员」来切换认证源
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # 锁定在**最低支持版本**上跑（见 db/runtime.mjs）：CI 的一个价值就是守住下限。
          # 别往下调 —— 代码用到 Node 22.16 才有的 sqlite.backup() / setReturnArrays()。
          node-version: "22.16"
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建
        run: npm run build

      - name: 启动前自检
        run: npm run preflight

      - name: 起 mock LDAP 与平台，跑回归套件
        run: |
          set -e
          node scripts/mock-ldap-server.mjs --port 3890 > /tmp/mock-ldap.log 2>&1 &
          node .next/standalone/server.js > /tmp/platform.log 2>&1 &

          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8787/healthz > /dev/null 2>&1; then
              echo "平台已就绪（第 ${i} 次探测）"
              break
            fi
            sleep 1
          done

          if ! curl -sf http://127.0.0.1:8787/healthz > /dev/null 2>&1; then
            echo "::error::平台未能启动"
            tail -80 /tmp/platform.log || true
            exit 1
          fi

          # 认证源与三个角色先备好：套件里的冒烟用例需要「管理员 / 审批人 / 发起人」齐备，
          # 专项脚本各自只会补自己那一块，凑不齐（CI 里也没有人可以去页面上点）。
          node scripts/seed-mock-env.mjs --base http://127.0.0.1:8787 --sync

          # 五个专项一次跑完（收发闭环 / 内容防护 / 冒烟 / 邮件 / 域账号登录）。
          # 步骤日志与 Job Summary 都需要登录才能看，**注解（annotation）不用** ——
          # 套件内部会用 ::notice / ::error 把结论发成注解。
          bash scripts/ci-regressions.sh --base http://127.0.0.1:8787

      - name: 失败时输出服务日志
        if: failure()
        run: |
          echo "===== platform ====="
          tail -120 /tmp/platform.log || true
          echo "===== mock ldap ====="
          tail -60 /tmp/mock-ldap.log || true
