# 文件安全收发平台 —— 一套环境一条命令起起来。
#
#   cp .env.docker.example .env.docker                      # 填好密钥（至少 CONFIG_ENCRYPTION_KEY）
#   docker compose --env-file .env.docker up -d --build                   # 平台 + 备份 sidecar
#   docker compose --env-file .env.docker --profile dev up -d             # 额外带一个测试用 LDAP（生产连内网真实 AD，不要用）
#
# ⚠️ 容器只读 .env.docker，**不要**复用仓库根的 .env —— 那是本地开发用的。
#    两者共用同一把密钥，会让「开发机密钥泄漏」直接波及容器里加密的 LDAP 口令。
#    仓库根的 .env 与 .env.docker 各管一套，互不影响。
#
# 数据按用途拆成三个卷，备份边界因此变得明确：
#   platform-db      /data/db      —— SQLite 主库（含 WAL）
#   platform-files   /data/files   —— 隔离区对象（按 objectKey 落盘）
#   platform-backups /data/backups —— 备份产物；可改成宿主机目录或备份盘
#
# 与重构前的差别：不再需要「启动时生成 wrangler.local.json」与「靠标记文件判断是否初始化」，
# 迁移由 drizzle/ 目录清单驱动、幂等执行（见 db/migrations.mjs）。

name: transfer-approval-platform

services:
  platform:
    build:
      context: .
      dockerfile: docker/Dockerfile.platform
    image: ${PLATFORM_IMAGE:-transfer-approval-platform}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      # 数据根目录：容器内固定为 /data，三个子目录由卷挂载
      DATA_DIR: /data
      PORT: "8787"
      HOSTNAME: "0.0.0.0"
      # 会话签名 + LDAP 密码加密。上线后不可更换，否则所有会话失效、已存密码无法解密。
      CONFIG_ENCRYPTION_KEY: ${CONFIG_ENCRYPTION_KEY:?请在 .env 中提供至少 32 位随机串}
      QUARANTINE_RETENTION_DAYS: ${QUARANTINE_RETENTION_DAYS:-7}
      # 配置后「本地管理员」兜底登录会自动禁用 —— 生产必须配置。
      # 同时它也是「登录必须校验域密码」的开关：未配置 = 联调态，允许自声明邮箱登录。
      PLATFORM_ADMIN_EMAILS: ${PLATFORM_ADMIN_EMAILS:-}
      PLATFORM_APPROVER_EMAILS: ${PLATFORM_APPROVER_EMAILS:-}
      PLATFORM_AUDITOR_EMAILS: ${PLATFORM_AUDITOR_EMAILS:-}
      # 域账号登录：自声明登录开关（仅联调可 true）与失败锁定阈值
      ALLOW_SELF_DECLARED_LOGIN: ${ALLOW_SELF_DECLARED_LOGIN:-false}
      LOGIN_MAX_FAILURES: ${LOGIN_MAX_FAILURES:-5}
      LOGIN_LOCK_MINUTES: ${LOGIN_LOCK_MINUTES:-15}
      # 目录条目数超过 AD 单次上限（默认 1000）时才需要；0 表示关闭分页
      LDAP_PAGE_SIZE: ${LDAP_PAGE_SIZE:-500}
      # LDAPS 严格证书校验：自签名证书的内网 AD 保持 false
      LDAP_TLS_REJECT_UNAUTHORIZED: ${LDAP_TLS_REJECT_UNAUTHORIZED:-false}
    volumes:
      - platform-db:/data/db
      - platform-files:/data/files
      - platform-backups:/data/backups
    # ---------- 运行时加固 ----------
    # 根文件系统只读：镜像即不可变，运行期无法写入 / 篡改自身；可写位置只有 /data 卷与下面两处 tmpfs。
    read_only: true
    tmpfs:
      # Next standalone 运行期需要写缓存目录（图片优化 / 数据缓存）与临时目录
      - /tmp
      - /app/.next/cache
    # 丢弃全部 Linux capabilities：监听 8787（>1024）不需要 NET_BIND_SERVICE，容器也不需要任何特权。
    cap_drop:
      - ALL
    # 禁止通过 setuid/setgid 提权
    security_opt:
      - no-new-privileges:true
    networks:
      - approval-zone
    ports:
      # 默认只绑本机回环，避免误暴露；内网正式部署改成审批网段地址或前置反向代理
      - "${PLATFORM_BIND:-127.0.0.1}:8787:8787"
    # 等 LDAP 就绪只在 dev profile 下有意义；required:false 让不带 profile 时也能正常起
    depends_on:
      ldap:
        condition: service_started
        required: false
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # ---------- 备份 sidecar ----------
  # 复用平台镜像（同一份 backup.mjs），周期性做 SQLite 在线热备 + 文件增量镜像。
  # 之所以用独立容器而不是让平台自己定时：备份失败不应影响业务进程，且备份脚本的
  # 资源占用（大目录遍历）与业务隔离更安全。
  backup:
    build:
      context: .
      dockerfile: docker/Dockerfile.platform
    image: ${PLATFORM_IMAGE:-transfer-approval-platform}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      # 备份周期（秒）。默认 24 小时；数据库备份保留份数由 BACKUP_KEEP 控制。
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
    volumes:
      - platform-db:/data/db:ro
      - platform-files:/data/files:ro
      - platform-backups:/data/backups
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        interval="$${BACKUP_INTERVAL_SECONDS:-86400}"
        echo "[backup] 启动：每 $${interval}s 备份一次，数据库保留 $${BACKUP_KEEP:-14} 份"
        while true; do
          node scripts/backup.mjs --keep "$${BACKUP_KEEP:-14}" || echo "[backup] 本次备份失败，等待下一轮"
          sleep "$${interval}"
        done
    # 该容器不提供 HTTP 服务，禁用镜像里继承的 /healthz 探针
    healthcheck:
      disable: true
    # 与平台容器同等的加固：只读根文件系统，只允许写 /data/backups 卷
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - approval-zone

  # ---------- 仅测试用：LDAP 目录 ----------
  # 生产环境请连内网真实 AD，不要启用本服务。
  # 种子目录（seed.ldif）直接打进镜像：引导脚本要 sed -i 原地改写它，
  # 单文件 bind mount 不支持 rename，挂载方式会启动即崩。
  ldap:
    build:
      context: ./docker
      dockerfile: ldap/Dockerfile.ldap
    image: ${LDAP_IMAGE:-transfer-ldap-seed:latest}
    profiles: ["dev"]
    restart: unless-stopped
    environment:
      LDAP_ORGANISATION: ${LDAP_ORGANISATION:-Example Corp}
      LDAP_DOMAIN: ${LDAP_DOMAIN:-example.local}
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD:-admin}
      LDAP_CONFIG_PASSWORD: ${LDAP_CONFIG_PASSWORD:-config}
      LDAP_TLS: "false"
      LDAP_REMOVE_CONFIG_AFTER_SETUP: "false"
    volumes:
      - ldap-data:/var/lib/ldap
      - ldap-config:/etc/ldap/slapd.d
    networks:
      - approval-zone
    ports:
      # 只在回环上暴露，方便本地用客户端查看；平台通过服务名 ldap 访问
      - "${LDAP_BIND:-127.0.0.1}:389:389"
    healthcheck:
      test: ["CMD-SHELL", "ldapsearch -x -H ldap://127.0.0.1:389 -s base -b '' '(objectClass=*)' namingContexts >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5

networks:
  # 内网审批区：平台与目录服务。平台不在此网段对外暴露未受控端口。
  approval-zone:
    driver: bridge

volumes:
  # 平台业务数据，按用途拆分（备份策略明确，而不是「打包整个卷」）
  platform-db:
  platform-files:
  platform-backups:
  ldap-data:
  ldap-config:
